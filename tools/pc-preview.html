<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>オルドのPC画面 — 三十一匹目の猫</title><link rel="stylesheet" href="../style.css"><body><main id="app"><header><span>RE:TRACE / オルドのPC</span><a href="../" style="color:inherit">本棚へ</a></header><section id="reader"><div id="scene"><img id="background" src="../assets/minato_room_night.png" alt=""><div id="pc" data-mode="terminal"><canvas id="pc-neural" aria-hidden="true"></canvas><div id="pc-ui"></div></div></div><div id="reading"><p id="chapter-label">PC画面の演出確認</p><p style="font-size:16px;line-height:1.9">橙色の光が流れるネットワーク。<br>少し間を置きながら、文字が打ち込まれます。</p></div><nav><button id="replay">もう一度</button><button id="next">次の台詞</button><button id="reveal">全文表示</button><button id="reduce">演出軽減</button></nav></section></main><script type="module">
import {NeuralBackdrop,PcTypewriter} from '../pc-effects.js';import {createPresentation} from '../presentation.js';
const data=await(await fetch('../data/manuscript.json')).json(),samples=createPresentation(data.sections).filter(b=>b.ci>=1&&b.cue.pcMode==='terminal'&&b.cue.pcText),network=new NeuralBackdrop(document.querySelector('canvas')),writer=new PcTypewriter(document.querySelector('#pc-ui'));let index=0,reduced=matchMedia('(prefers-reduced-motion: reduce)').matches,generation=0;
function show(){network.set(true,{reduced});writer.set(samples[index].cue.pcText,String(++generation),{instant:reduced,speed:42});}document.querySelector('#replay').onclick=show;document.querySelector('#next').onclick=()=>{index=(index+1)%samples.length;show();};document.querySelector('#reveal').onclick=()=>writer.finish();document.querySelector('#reduce').onclick=()=>{reduced=!reduced;document.querySelector('#reduce').textContent=reduced?'演出軽減：入':'演出軽減：切';show();};document.addEventListener('visibilitychange',()=>{network.setPaused(document.hidden);if(document.hidden)writer.pause();else writer.resume();});window.addEventListener('pagehide',()=>{network.dispose();writer.cancel();});show();
</script></body></html>
