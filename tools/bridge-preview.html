<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>本編接続口の確認</title><body style="background:#10191f;color:#ddd;font:16px sans-serif;padding:24px"><h1>本編接続口の確認</h1><p>本編ファイルの変更なし。テスト専用の読書記録で、独立ビューアーを開きます。</p><button id="open">小説を開く</button><p id="result">未起動</p><p id="save">保存受信なし</p><script type="module">import {openThirtyFirstCat} from '../integration/bridge.js';let state;document.querySelector('#open').onclick=async()=>{document.querySelector('#result').textContent='独立ビューアー表示中';const result=await openThirtyFirstCat({src:'../index.html?test=1',initialState:state,onSave:s=>{state=s;document.querySelector('#save').textContent='保存受信：第'+(s.chapterIndex+1)+'節・段落'+(s.beatIndex+1)+'・文字位置'+s.pageOffset;}});document.querySelector('#result').textContent='元の画面に復帰しました。読了：'+result.completed+'／テスト：'+result.testMode;};</script></body></html>
