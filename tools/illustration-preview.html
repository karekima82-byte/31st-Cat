<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="../"><title>三十一匹目の猫・追加イラスト</title><style>body{margin:24px;background:#10191f;color:#e6e4dd;font:14px system-ui}h1{font-size:22px;font-weight:400}.art{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;max-width:1000px}figure{margin:0}figure img{display:block;width:100%;height:280px;object-fit:contain;background:repeating-conic-gradient(#253239 0 25%,#33434a 0 50%) 0/24px 24px}figcaption{padding:10px 0}section{max-width:900px;display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:24px}.wallpaper{position:relative;height:300px;background:linear-gradient(135deg,#31464d,#687c72);border:8px solid #283038}.cat{position:absolute;width:9%;height:13%;transform:translate(-50%,-50%)}.cat img{width:100%;height:100%;object-fit:contain}@media(max-width:600px){.art{grid-template-columns:1fr}section{grid-template-columns:1fr}.wallpaper{height:280px}}</style><h1>三十一匹目の猫 · 追加イラスト</h1><p>通常の猫・白猫・PC本体。背景は透過です。</p><div class="art"><figure><img src="assets/cat_base_tabby.png" alt="壁紙用の猫"><figcaption>CAT_BASE / 通常の猫</figcaption></figure><figure><img src="assets/cat31_white.png" alt="31匹目の白猫"><figcaption>CAT31 / 白猫差分</figcaption></figure><figure><img src="assets/laptop_front_transparent.png" alt="透過の古いノートPC"><figcaption>PROP01 / PC本体（組込前の素材）</figcaption></figure></div><section><div><h2>30匹</h2><div class="wallpaper" id="thirty"></div></div><div><h2>31匹</h2><div class="wallpaper" id="thirty-one"></div></div></section><script type="module">import {catPositions} from './core.js';import {catArt} from './data/cat-art.js';for(const [id,count]of [['thirty',30],['thirty-one',31]])for(const cat of catPositions(count)){const el=document.createElement('span'),img=document.createElement('img');el.className='cat';el.dataset.cat=cat.id;el.style.left=cat.x+'%';el.style.top=cat.y+'%';img.src=cat.white?catArt.white:catArt.ordinary;img.alt='';el.append(img);document.getElementById(id).append(el);}</script></html>
