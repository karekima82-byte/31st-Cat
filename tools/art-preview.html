<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>三十一匹目の猫・背景制作一覧</title><style>body{margin:24px;background:#10191f;color:#ddd;font:14px system-ui}h1{font-size:22px;font-weight:400}main{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;max-width:1000px}figure{margin:0}img{width:100%;aspect-ratio:9/16;object-fit:cover}figcaption{padding:8px 0}@media(max-width:500px){main{grid-template-columns:repeat(2,minmax(0,1fr))}}</style><h1>三十一匹目の猫 · 背景制作一覧</h1><p>採用確認前の生成素材。文字・投票・猫は別レイヤーで表示します。</p><main></main><script type="module">const names=[['ordo_city_blackout','BG01 都市・停電'],['ordo_control_room','BG02 管制室'],['minato_room_night','BG03 湊の部屋・夜'],['hospital_corridor','BG04 病院の廊下'],['hospital_window','BG05 病室の窓'],['causality_room','BG06 因果の部屋'],['minato_room_lamplight','BG07 湊の部屋・灯り'],['assembly_hall','BG08 議場'],['minato_room_morning','BG09 湊の部屋・朝']];for(const [id,name]of names){const figure=document.createElement('figure'),img=document.createElement('img'),cap=document.createElement('figcaption');img.src='../assets/'+id+'.png';img.alt=name;cap.textContent=name;figure.append(img,cap);document.querySelector('main').append(figure);}</script></html>
